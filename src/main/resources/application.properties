# Votre configuration existante
spring.application.name=MARKET
spring.datasource.url=jdbc:mysql://localhost:3307/market?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web=DEBUG
server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ajoutez ces lignes
logging.level.org.example.market.api.mobile=DEBUG
logging.level.org.example.market.user=DEBUG

# CORS
#spring.web.cors.allowed-origins=http://192.168.30.3:8080,http://localhost:8080,capacitor://localhost,http://localhost
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Static files (www folder)
spring.web.resources.static-locations=file:www/,classpath:/static/
spring.web.resources.cache.period=0
# CORS - ajoutez la nouvelle IP
spring.web.cors.allowed-origins=http://192.168.100.8:8080,http://192.168.30.3:8080,http://localhost:8080,capacitor://localhost

