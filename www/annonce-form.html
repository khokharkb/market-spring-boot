<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonce</title>
    <!-- Fixed: Added missing quote after CSS path -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/annonceform.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<!-- Navigation Header -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: #111;">
    <div class="container">
        <a class="navbar-brand" href="/" th:href="@{/}">
            <i class="fas fa-store"></i> Market
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/annonces" th:href="@{/annonces}">
                <i class="fas fa-list"></i> Annonces
            </a>
            <a class="nav-link" href="/" th:href="@{/}">
                <i class="fas fa-home"></i> Accueil
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header text-center">
                    <!-- Check if annonce exists (edit mode) or not (create mode) -->
                    <h2 th:if="${annonce != null and annonce.id != null}">Modifier l'annonce</h2>
                    <h2 th:unless="${annonce != null and annonce.id != null}">Nouvelle Annonce</h2>
                </div>
                <div class="card-body">

                    <!-- FORM FOR CREATION (when no ID or new) -->
                    <form th:if="${annonce == null or annonce.id == null}"
                          th:action="@{/annonces}"
                          th:object="${annonce}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="titre" class="form-label">Titre :</label>
                            <input type="text" th:field="*{titre}" id="titre" class="form-control" required>
                            <div class="form-text">Donnez un titre clair et descriptif</div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description :</label>
                            <textarea th:field="*{description}" id="description" class="form-control" rows="5" required></textarea>
                            <div class="form-text">Décrivez votre article en détail</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="prix" class="form-label">Prix (dz) :</label>
                                <div class="input-group">
                                    <input type="number" th:field="*{prix}" id="prix" class="form-control"
                                           required step="0.01" min="0" placeholder="0.00">
                                    <span class="input-group-text">dz</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="categorie" class="form-label">Catégorie :</label>
                                <select th:field="*{categorie}" id="categorie" class="form-select" required>
                                    <option value="">Sélectionnez une catégorie</option>
                                    <option value="Electronique">Électroménager & Électronique</option>
                                    <option value="Vehicules">Véhicules</option>
                                    <option value="Immobilier">Immobilier</option>
                                    <option value="Maison">Maison & Meubles</option>
                                    <option value="Mode">Mode & Vetements</option>
                                    <option value="Santé">Santé & Beautés</option>
                                    <option value="Loisirs">Loisirs & Sport</option>
                                    <option value="Emploi">Emploi & Services</option>
                                    <option value="Cuisine">Cuisine</option>
                                    <option value="Telephone">Telephone & Accesoires</option>
                                    <option value="Informatique">Informatique</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                        </div>

                        <!-- Champ téléphone pour la création -->
                        <div class="mb-3">
                            <label for="telephone" class="form-label">Téléphone :</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-phone"></i>
                                </span>
                                <input type="tel" th:field="*{telephone}" id="telephone"
                                       class="form-control" required
                                       placeholder="Ex: 0770123456">
                            </div>
                            <div class="form-text">Votre numéro de téléphone sera visible par les acheteurs</div>
                        </div>

                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Image :</label>
                            <input type="file" name="imageFile" id="imageFile" class="form-control"
                                   accept="image/*" required>
                            <div class="form-text">Formats acceptés: JPG, PNG, GIF (max 5MB)</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/annonces}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-paper-plane"></i> Publier l'annonce
                            </button>
                        </div>
                    </form>

                    <!-- FORM FOR EDITING (when annonce has ID) -->
                    <form th:if="${annonce != null and annonce.id != null}"
                          th:action="@{'/annonces/' + ${annonce.id} + '/edit'}"
                          th:object="${annonce}"
                          method="post"
                          enctype="multipart/form-data">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="titreEdit" class="form-label">Titre :</label>
                            <input type="text" th:field="*{titre}" id="titreEdit" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="descriptionEdit" class="form-label">Description :</label>
                            <textarea th:field="*{description}" id="descriptionEdit" class="form-control" rows="5" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="prixEdit" class="form-label">Prix (dz) :</label>
                                <div class="input-group">
                                    <input type="number" th:field="*{prix}" id="prixEdit" class="form-control"
                                           required step="0.01" min="0">
                                    <span class="input-group-text">dz</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="categorieEdit" class="form-label">Catégorie :</label>
                                <select th:field="*{categorie}" id="categorieEdit" class="form-select" required>
                                    <option value="">Sélectionnez une catégorie</option>
                                    <option value="Electronique">Électronique</option>
                                    <option value="Vehicules">Véhicules</option>
                                    <option value="Immobilier">Immobilier</option>
                                    <option value="Maison">Maison & Jardin</option>
                                    <option value="Mode">Mode & Beauté</option>
                                    <option value="Loisirs">Loisirs & Sport</option>
                                    <option value="Emploi">Emploi & Services</option>
                                    <option value="Cuisine">Rangement& cuisine</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                        </div>

                        <!-- Champ téléphone pour l'édition -->
                        <div class="mb-3">
                            <label for="telephoneEdit" class="form-label">Téléphone :</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-phone"></i>
                                </span>
                                <input type="tel" th:field="*{telephone}" id="telephoneEdit"
                                       class="form-control" required
                                       placeholder="Ex: 0770123456">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="imageFileEdit" class="form-label">Nouvelle Image (optionnel) :</label>
                            <input type="file" name="imageFile" id="imageFileEdit" class="form-control" accept="image/*">
                            <div class="mt-3">
                                <p class="form-text mb-2">Image actuelle :</p>
                                <div th:if="${annonce.imagePath != null and annonce.imagePath != ''}">
                                    <img th:src="@{'/uploads/' + ${annonce.imagePath}}"
                                         alt="Image actuelle"
                                         class="img-thumbnail"
                                         style="max-width: 200px; max-height: 200px;"
                                         onerror="this.src='/images/default.jpg'; this.onerror=null;">
                                </div>
                                <div th:unless="${annonce.imagePath != null and annonce.imagePath != ''}" class="alert alert-info">
                                    Aucune image disponible
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/annonces}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i> Mettre à jour
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" src="js/app.js"></script>

<script>
    // Client-side validation
    document.addEventListener('DOMContentLoaded', function() {
        const forms = document.querySelectorAll('form');
        forms.forEach(form => {
            form.addEventListener('submit', function(e) {
                const fileInput = this.querySelector('input[type="file"]');
                if (fileInput && fileInput.required && !fileInput.value) {
                    e.preventDefault();
                    alert('Veuillez sélectionner une image pour votre annonce.');
                    fileInput.focus();
                }
            });
        });
    });
</script>
</body>
</html>
